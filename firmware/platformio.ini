; ============================================================
;  PlatformIO Project Configuration
;  Target : ESP32 DevKit V1
;  Project: Flex Sensor Trainer Kit + Web Simulator
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ── Libraries ───────────────────────────────────────────────
; LiquidCrystal I2C for 16x4 LCD via I2C backpack
; ESP32Servo for servo control
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    madhephaestus/ESP32Servo         @ ^3.0.6

; ── Build options ───────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_speed = 115200
upload_speed  = 921600
